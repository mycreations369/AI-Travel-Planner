<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Travel Planner</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

<h1>✈️ AI Travel Planner</h1>
<p class="subtitle">Plan your perfect trip instantly</p>

<div class="form-box">

<input type="text" id="destination" placeholder="Enter Destination">

<input type="number" id="days" placeholder="Number of Days">

<input type="number" id="budget" placeholder="Budget in ₹">

<select id="travelType">
<option value="Solo">Solo</option>
<option value="Family">Family</option>
<option value="Friends">Friends</option>
<option value="Couple">Couple</option>
</select>

<button onclick="generatePlan()">Generate Travel Plan</button>

</div>

<div id="result"></div>

</div>

<script src="script.js"></script>

</body>
</html>
