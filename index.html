<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Smart Travel Planner Pro</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

<h1>✈️ AI Smart Travel Planner Pro</h1>
<p class="subtitle">Plan Your Dream Journey Instantly</p>

<div class="form-box">

<input type="text" id="destination" placeholder="Enter Destination">

<input type="number" id="days" placeholder="Number of Days">

<input type="number" id="budget" placeholder="Budget (₹)">

<select id="travelType">
<option>Solo</option>
<option>Family</option>
<option>Friends</option>
<option>Couple</option>
</select>

<select id="interest">
<option>Adventure</option>
<option>Nature</option>
<option>Food</option>
<option>Historical</option>
<option>Shopping</option>
</select>

<button onclick="generatePlan()">Generate Travel Plan</button>

<button onclick="openMap()">📍 View on Google Maps</button>

<button onclick="downloadPlan()">📄 Download Plan</button>

</div>

<div id="result"></div>

</div>

<script src="script.js"></script>

</body>
</html>
